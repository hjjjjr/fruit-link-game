<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>果园连连看</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><div class="cloud c1"></div><div class="cloud c2"></div><header><div class="pill"><small>关卡</small><b id="level">1</b></div><h1>果园<br>连连看</h1><div class="pill"><small>最高分</small><b id="best">0</b></div></header><section class="score-row"><div class="meter"><i id="progress"></i></div><strong id="score">0 分</strong></section><section class="board-shell"><div id="board" class="board" aria-label="连连看棋盘"></div></section><p id="message" class="hint">点击两个相同的图案即可消除</p><nav><button id="hintBtn">提示 <em id="hints">3</em></button><button id="shuffleBtn">洗牌 <em id="shuffles">3</em></button><button id="pauseBtn">暂停</button></nav></main><div id="overlay" class="overlay hidden"><section class="modal"><span>★</span><h2 id="modalTitle">闯关成功！</h2><p id="modalText"></p><button id="modalBtn">下一关</button></section></div><script src="game.js"></script></body></html>
